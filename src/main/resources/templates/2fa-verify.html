<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ввод кода 2FA</title>
    <link rel="stylesheet" th:href="@{/css/form-style.css}">
</head>
<body>
<div class="wrapper">
    <div class="card" style="text-align: center">
        <h1>Двухфакторная аутентификация</h1>
        <form id="verify2faForm" autocomplete="off" style="display:flex;flex-direction:column;align-items:center;gap:10px;max-width:300px;margin:0 auto;">
            <label for="code">Введите код из Google Authenticator:</label>
            <input type="text" id="code" name="code" required maxlength="6" pattern="\d{6}" placeholder="6-значный код" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;letter-spacing:2px;font-size:1.2em;"/>
            <button type="submit">Войти</button>
        </form>
        <div id="result"></div>
    </div>
</div>
<script src="/js/2fa-verify.js"></script>
</body>
</html>
