<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Создать плейлист в Spotify</title>
    <link rel="stylesheet" href="/css/form-style.css" />
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>Создание Spotify-плейлиста</h1>
        <form id="createPlaylistForm">
            <label for="playlistName">Название:</label>
            <input type="text" id="playlistName" name="playlistName" placeholder="Мой плейлист" required />

            <label for="genre">Жанр:</label>
            <select id="genre" name="genre">
                <option value="">Авто</option>
                <option value="pop">Pop</option>
                <option value="rock">Rock</option>
                <option value="hip-hop">Hip-Hop</option>
                <option value="jazz">Jazz</option>
                <option value="classical">Classical</option>
                <option value="electronic">Electronic</option>
                <option value="indie">Indie</option>
                <option value="metal">Metal</option>
                <option value="rnb">R&B</option>
                <option value="folk">Folk</option>
            </select>

            <label for="region">Регион:</label>
            <select id="region" name="region">
                <option value="RU">Россия</option>
                <option value="US">США</option>
                <option value="GB">Великобритания</option>
                <option value="DE">Германия</option>
                <option value="FR">Франция</option>
                <option value="JP">Япония</option>
                <option value="BR">Бразилия</option>
                <option value="AU">Австралия</option>
            </select>

            <button type="submit">Создать</button>
        </form>
        <div id="result"></div>
    </div>
</div>
<script src="/js/createPlaylist.js"></script>
</body>
</html>
