<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Поиск видео на YouTube</title>
  <link rel="stylesheet" href="/css/form-style.css" />
  <style>
    #videos {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .video-item {
      flex: 1 1 300px;
    }
    iframe {
      width: 100%;
      height: 200px;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <h1>Поиск видео на YouTube</h1>
    <form id="youtubeForm">
      <label for="query">Введите запрос:</label>
      <input type="text" id="query" required />
      <button type="submit">Найти видео</button>
    </form>
    <div id="videos"></div>
  </div>
</div>

<script src="/js/youtube.js"></script>
</body>
</html>
